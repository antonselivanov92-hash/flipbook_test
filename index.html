<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gigaset Pro — Каталог</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000 !important;
      overflow: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #flipbook-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      inset: 0;
      background: #000 !important;
      overflow: hidden;
      z-index: 1;
    }

    #flipbook {
      width: 100%;
      height: 100%;
      background: #000 !important;
    }

    .stf__parent,
    .stf__wrapper,
    .stf__block,
    .stf__item,
    .stf__outer,
    .stf__block canvas,
    .stf__parent canvas,
    canvas,
    div[class*="stf"],
    .stf__item.--hard,
    .stf__item.--hard .stf__hard-page,
    .stf__item.--left,
    .stf__item.--right {
      background: #000 !important;
      background-color: #000 !important;
    }

    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(14px);
      padding: 8px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .controls button {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .controls button:hover { background: rgba(255,255,255,0.25); }
    .controls button:disabled { opacity: 0.3; cursor: default; }

    .controls .sep {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.18);
      margin: 0 2px;
    }

    #page-info {
      color: rgba(255,255,255,0.88);
      font-size: 14px;
      min-width: 70px;
      text-align: center;
      line-height: 44px;
      user-select: none;
    }

    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.5s;
      text-align: center;
      max-width: 90vw;
    }

    #zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      flex-direction: column;
    }

    #zoom-overlay.open { display: flex; }

    .zoom-topbar,
    .zoom-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(14px);
      z-index: 2;
    }

    .zoom-topbar {
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .zoom-toolbar { border-top: 1px solid rgba(255,255,255,0.08); }

    .zoom-topbar button,
    .zoom-toolbar button {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      min-width: 44px;
      height: 44px;
      padding: 0 14px;
      border-radius: 22px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      user-select: none;
      white-space: nowrap;
    }

    .zoom-topbar button:hover,
    .zoom-toolbar button:hover { background: rgba(255,255,255,0.25); }

    .zoom-topbar button:disabled,
    .zoom-toolbar button:disabled { opacity: 0.3; cursor: default; }

    #zoom-close {
      background: rgba(220, 50, 50, 0.55);
      font-size: 15px;
      font-weight: 600;
    }

    #zoom-close:hover { background: rgba(220, 50, 50, 0.85); }

    #zoom-page-label {
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.02em;
      user-select: none;
    }

    #zoom-scale-label {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      min-width: 48px;
      text-align: center;
      user-select: none;
    }

    #zoom-viewport {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background: #000;
    }

    #zoom-viewport.dragging { cursor: grabbing; }

    #zoom-img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    }

    .zoom-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .controls {
        bottom: 12px;
        padding: 6px 10px;
        gap: 6px;
      }
      .controls button {
        width: 38px;
        height: 38px;
        font-size: 16px;
      }
      #page-info { min-width: 58px; font-size: 13px; line-height: 38px; }
      .hint { display: none; }
      .zoom-hint { display: none; }
      .zoom-topbar button,
      .zoom-toolbar button {
        min-width: 40px;
        height: 40px;
        font-size: 15px;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <div class="hint" id="hint">Листайте ← → · лупа — увеличить страницу · ⛶ — на весь экран · Esc — выход</div>

  <div id="flipbook-container">
    <div id="flipbook"></div>
  </div>

  <div class="controls">
    <button id="prev" title="Предыдущая">‹</button>
    <div id="page-info">1 / 24</div>
    <button id="next" title="Следующая">›</button>
    <div class="sep"></div>
    <button id="open-zoom" title="Увеличить страницу">🔍</button>
    <button id="toggle-fs" title="На весь экран">⛶</button>
  </div>

  <div id="zoom-overlay" aria-hidden="true">
    <div class="zoom-topbar">
      <button id="zoom-close" title="Выйти из увеличения">✕ Выйти</button>
      <div id="zoom-page-label">1 / 24</div>
      <button id="zoom-fs" title="На весь экран">⛶</button>
    </div>
    <div id="zoom-viewport">
      <img id="zoom-img" alt="Страница каталога" draggable="false">
      <div class="zoom-hint">Колёсико / щипок — масштаб · перетаскивание — сдвиг · Esc — выход</div>
    </div>
    <div class="zoom-toolbar">
      <button id="zoom-prev" title="Предыдущая">‹</button>
      <button id="zoom-minus" title="Уменьшить">−</button>
      <div id="zoom-scale-label">100%</div>
      <button id="zoom-plus" title="Увеличить">+</button>
      <button id="zoom-reset" title="Вписать в экран">⌂</button>
      <button id="zoom-next" title="Следующая">›</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script>
    const PAGE_ASPECT = 1400 / 1980;
    const TOTAL_PAGES = 24;

    const pages = [];
    pages.push('page-00.png');
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      pages.push('page-' + String(i).padStart(2, '0') + '.png');
    }

    const baseWidth = 700;
    const baseHeight = Math.round(baseWidth / PAGE_ASPECT);

    const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
      width: baseWidth,
      height: baseHeight,
      size: 'stretch',
      minWidth: 280,
      maxWidth: 1100,
      minHeight: 400,
      maxHeight: 1600,
      drawShadow: true,
      flippingTime: 800,
      usePortrait: true,
      startPage: 0,
      autoSize: true,
      maxShadowOpacity: 0.35,
      showCover: false,
      mobileScrollSupport: true,
      clickEventForward: true,
      useMouseEvents: true,
      swipeDistance: 30,
      showPageCorners: true,
      disableFlipByClick: false
    });

    pageFlip.loadFromImages(pages);

    const patchCanvasClear = () => {
      try {
        if (pageFlip.render && typeof pageFlip.render.clear === 'function' && pageFlip.render.ctx) {
          pageFlip.render.clear = function () {
            this.ctx.fillStyle = '#000000';
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          };
          pageFlip.render.clear();
          if (typeof pageFlip.update === 'function') pageFlip.update();
          return true;
        }
      } catch (e) {}
      return false;
    };

    if (!patchCanvasClear()) {
      setTimeout(() => {
        if (!patchCanvasClear()) setTimeout(patchCanvasClear, 400);
      }, 150);
    }

    const pageInfo = document.getElementById('page-info');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    function catalogPageFromIndex(idx) {
      return Math.max(1, Math.min(idx, TOTAL_PAGES));
    }

    function updateUI() {
      const idx = pageFlip.getCurrentPageIndex();
      const displayCurrent = catalogPageFromIndex(idx);
      pageInfo.textContent = displayCurrent + ' / ' + TOTAL_PAGES;
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= TOTAL_PAGES;
    }

    pageFlip.on('flip', updateUI);
    pageFlip.on('changeOrientation', updateUI);
    pageFlip.on('changeState', updateUI);

    prevBtn.addEventListener('click', () => pageFlip.flipPrev());
    nextBtn.addEventListener('click', () => pageFlip.flipNext());

    setTimeout(() => {
      const hint = document.getElementById('hint');
      if (hint) hint.style.opacity = '0';
    }, 5000);

    setTimeout(updateUI, 400);
    window.addEventListener('resize', () => pageFlip.update());

    const fsBtn = document.getElementById('toggle-fs');
    const zoomFsBtn = document.getElementById('zoom-fs');

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
      const el = document.documentElement;
      if (!isFullscreen()) {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) req.call(el);
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
      }
    }

    fsBtn.addEventListener('click', toggleFullscreen);
    zoomFsBtn.addEventListener('click', toggleFullscreen);

    const overlay = document.getElementById('zoom-overlay');
    const viewport = document.getElementById('zoom-viewport');
    const img = document.getElementById('zoom-img');
    const zoomPageLabel = document.getElementById('zoom-page-label');
    const zoomScaleLabel = document.getElementById('zoom-scale-label');
    const zoomPrev = document.getElementById('zoom-prev');
    const zoomNext = document.getElementById('zoom-next');

    const zoom = {
      open: false,
      page: 1,
      scale: 1,
      minScale: 0.2,
      maxScale: 5,
      tx: 0,
      ty: 0,
      fitScale: 1,
      dragging: false,
      lastX: 0,
      lastY: 0,
      pointers: new Map()
    };

    function pageSrc(n) {
      return 'page-' + String(n).padStart(2, '0') + '.png';
    }

    function applyTransform() {
      img.style.transform = 'translate(-50%, -50%) translate(' + zoom.tx + 'px, ' + zoom.ty + 'px) scale(' + zoom.scale + ')';
      const pct = Math.round((zoom.scale / zoom.fitScale) * 100);
      zoomScaleLabel.textContent = pct + '%';
    }

    function computeFitScale() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const nw = img.naturalWidth || 1400;
      const nh = img.naturalHeight || 1980;
      const pad = 24;
      return Math.min((vw - pad) / nw, (vh - pad) / nh);
    }

    function fitToScreen() {
      zoom.fitScale = computeFitScale();
      zoom.minScale = zoom.fitScale * 0.6;
      zoom.scale = zoom.fitScale;
      zoom.tx = 0;
      zoom.ty = 0;
      applyTransform();
    }

    function setScaleAround(newScale, cx, cy) {
      const rect = viewport.getBoundingClientRect();
      const px = cx - rect.left - rect.width / 2;
      const py = cy - rect.top - rect.height / 2;
      const clamped = Math.min(zoom.maxScale, Math.max(zoom.minScale, newScale));
      const k = clamped / zoom.scale;
      zoom.tx = px - (px - zoom.tx) * k;
      zoom.ty = py - (py - zoom.ty) * k;
      zoom.scale = clamped;
      applyTransform();
    }

    function loadZoomPage(n) {
      zoom.page = Math.max(1, Math.min(TOTAL_PAGES, n));
      zoomPageLabel.textContent = zoom.page + ' / ' + TOTAL_PAGES;
      zoomPrev.disabled = zoom.page <= 1;
      zoomNext.disabled = zoom.page >= TOTAL_PAGES;
      img.onload = () => fitToScreen();
      img.src = pageSrc(zoom.page);
    }

    function openZoom(pageNum) {
      const idx = pageFlip.getCurrentPageIndex();
      const n = pageNum || catalogPageFromIndex(idx);
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      zoom.open = true;
      loadZoomPage(n);
    }

    function closeZoom() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      zoom.open = false;
      zoom.dragging = false;
      zoom.pointers.clear();
      if (pageFlip.getCurrentPageIndex() !== zoom.page) {
        try { pageFlip.flip(zoom.page); } catch (e) {}
      }
    }

    document.getElementById('open-zoom').addEventListener('click', () => openZoom());
    document.getElementById('zoom-close').addEventListener('click', closeZoom);
    document.getElementById('zoom-plus').addEventListener('click', () => {
      const rect = viewport.getBoundingClientRect();
      setScaleAround(zoom.scale * 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
    document.getElementById('zoom-minus').addEventListener('click', () => {
      const rect = viewport.getBoundingClientRect();
      setScaleAround(zoom.scale / 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
    document.getElementById('zoom-reset').addEventListener('click', fitToScreen);
    zoomPrev.addEventListener('click', () => loadZoomPage(zoom.page - 1));
    zoomNext.addEventListener('click', () => loadZoomPage(zoom.page + 1));

    viewport.addEventListener('wheel', (e) => {
      if (!zoom.open) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      setScaleAround(zoom.scale * factor, e.clientX, e.clientY);
    }, { passive: false });

    viewport.addEventListener('pointerdown', (e) => {
      viewport.setPointerCapture(e.pointerId);
      zoom.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (zoom.pointers.size === 1) {
        zoom.dragging = true;
        zoom.lastX = e.clientX;
        zoom.lastY = e.clientY;
        viewport.classList.add('dragging');
      }
    });

    viewport.addEventListener('pointermove', (e) => {
      if (!zoom.pointers.has(e.pointerId)) return;
      zoom.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (zoom.pointers.size === 2) {
        const pts = Array.from(zoom.pointers.values());
        const dist = function(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
        if (!zoom._pinchDist) {
          zoom._pinchDist = dist(pts[0], pts[1]);
          zoom._pinchScale = zoom.scale;
          return;
        }
        const d = dist(pts[0], pts[1]);
        const midX = (pts[0].x + pts[1].x) / 2;
        const midY = (pts[0].y + pts[1].y) / 2;
        setScaleAround(zoom._pinchScale * (d / zoom._pinchDist), midX, midY);
        return;
      }

      if (zoom.dragging && zoom.pointers.size === 1) {
        zoom.tx += e.clientX - zoom.lastX;
        zoom.ty += e.clientY - zoom.lastY;
        zoom.lastX = e.clientX;
        zoom.lastY = e.clientY;
        applyTransform();
      }
    });

    function endPointer(e) {
      zoom.pointers.delete(e.pointerId);
      if (zoom.pointers.size < 2) zoom._pinchDist = null;
      if (zoom.pointers.size === 0) {
        zoom.dragging = false;
        viewport.classList.remove('dragging');
      }
    }

    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);

    viewport.addEventListener('dblclick', (e) => {
      if (zoom.scale > zoom.fitScale * 1.05) fitToScreen();
      else setScaleAround(zoom.fitScale * 2.2, e.clientX, e.clientY);
    });

    window.addEventListener('resize', () => {
      if (zoom.open) {
        const oldFit = zoom.fitScale;
        zoom.fitScale = computeFitScale();
        zoom.minScale = zoom.fitScale * 0.6;
        if (Math.abs(zoom.scale - oldFit) < 0.02) fitToScreen();
        else applyTransform();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (zoom.open) { closeZoom(); return; }
        if (isFullscreen()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
        return;
      }

      if (zoom.open) {
        if (e.key === 'ArrowLeft') loadZoomPage(zoom.page - 1);
        if (e.key === 'ArrowRight') loadZoomPage(zoom.page + 1);
        if (e.key === '+' || e.key === '=') {
          const rect = viewport.getBoundingClientRect();
          setScaleAround(zoom.scale * 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        if (e.key === '-' || e.key === '_') {
          const rect = viewport.getBoundingClientRect();
          setScaleAround(zoom.scale / 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        if (e.key === '0') fitToScreen();
        return;
      }

      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
      if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') toggleFullscreen();
      if (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я') openZoom();
    });
  </script>
</body>
</html>
