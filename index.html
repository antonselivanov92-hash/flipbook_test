<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gigaset Pro — Каталог</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000 !important;
      overflow: hidden !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
      z-index: 1;
    }

    #flipbook-container {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1400px;
      height: 1980px;
      margin: 0;
      background: #000 !important;
      transform: translate(-50%, -50%);
      transform-origin: center center;
    }

    #flipbook {
      width: 1400px;
      height: 1980px;
      background: #000 !important;
    }

    .stf__parent,
    .stf__wrapper,
    .stf__block,
    .stf__item,
    .stf__outer,
    .stf__block canvas,
    .stf__parent canvas,
    canvas,
    div[class*="stf"],
    .stf__item.--hard,
    .stf__item.--hard .stf__hard-page,
    .stf__item.--left,
    .stf__item.--right {
      background: #000 !important;
      background-color: #000 !important;
    }

    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(14px);
      padding: 8px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .controls button {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      height: 44px;
      min-width: 44px;
      padding: 0 14px;
      border-radius: 22px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .controls button.round {
      width: 44px;
      padding: 0;
      border-radius: 50%;
      font-size: 18px;
    }

    .controls button:hover { background: rgba(255,255,255,0.25); }
    .controls button:disabled { opacity: 0.3; cursor: default; }

    #exit-fs {
      display: none;
      background: rgba(220, 50, 50, 0.55);
      font-weight: 600;
    }

    #exit-fs:hover { background: rgba(220, 50, 50, 0.85); }
    body.is-fs #exit-fs { display: flex; }
    body.is-fs #toggle-fs { display: none; }

    .controls .sep {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.18);
      margin: 0 2px;
    }

    #page-info {
      color: rgba(255,255,255,0.88);
      font-size: 14px;
      min-width: 70px;
      text-align: center;
      line-height: 44px;
      user-select: none;
    }

    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      z-index: 50;
      pointer-events: none;
      transition: opacity 0.5s;
      text-align: center;
      max-width: 90vw;
    }

    @media (max-width: 768px) {
      .controls {
        bottom: 12px;
        padding: 6px 10px;
        gap: 6px;
      }
      .controls button {
        height: 38px;
        min-width: 38px;
        font-size: 14px;
        padding: 0 10px;
      }
      .controls button.round {
        width: 38px;
        font-size: 16px;
      }
      #page-info { min-width: 58px; font-size: 13px; line-height: 38px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>

  <div class="hint" id="hint">Листайте ← → · ⛶ — страница 1400×1980 · колёсико только в полном экране</div>

  <div id="stage">
    <div id="flipbook-container">
      <div id="flipbook"></div>
    </div>
  </div>

  <div class="controls">
    <button class="round" id="prev" title="Предыдущая">‹</button>
    <div id="page-info">1 / 24</div>
    <button class="round" id="next" title="Следующая">›</button>
    <div class="sep"></div>
    <button id="toggle-fs" title="На весь экран">⛶ На весь экран</button>
    <button id="exit-fs" title="Выйти из полного экрана">✕ Выйти</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <script>
    const PAGE_W = 1400;
    const PAGE_H = 1980;
    const TOTAL_PAGES = 24;

    const pages = [];
    pages.push('page-00.png');
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      pages.push('page-' + String(i).padStart(2, '0') + '.png');
    }

    const pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
      width: PAGE_W,
      height: PAGE_H,
      size: 'fixed',
      minWidth: PAGE_W,
      maxWidth: PAGE_W,
      minHeight: PAGE_H,
      maxHeight: PAGE_H,
      drawShadow: true,
      flippingTime: 800,
      usePortrait: true,
      startPage: 0,
      autoSize: false,
      maxShadowOpacity: 0.35,
      showCover: false,
      mobileScrollSupport: true,
      clickEventForward: true,
      useMouseEvents: true,
      swipeDistance: 30,
      showPageCorners: true,
      disableFlipByClick: false
    });

    pageFlip.loadFromImages(pages);

    function getDpr() {
      return Math.min(window.devicePixelRatio || 1, 2);
    }

    function patchQuality() {
      try {
        const ui = pageFlip.getUI && pageFlip.getUI();
        if (!ui || !ui.canvas) return false;

        ui.resizeCanvas = function () {
          const dpr = getDpr();
          this.canvas.style.width = PAGE_W + 'px';
          this.canvas.style.height = PAGE_H + 'px';
          this.canvas.width = Math.round(PAGE_W * dpr);
          this.canvas.height = Math.round(PAGE_H * dpr);
          const ctx = this.canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
        };

        if (pageFlip.render) {
          pageFlip.render.clear = function () {
            const ctx = this.ctx;
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            ctx.restore();
          };
        }

        ui.resizeCanvas();
        if (typeof pageFlip.update === 'function') pageFlip.update();
        return true;
      } catch (e) {
        return false;
      }
    }

    if (!patchQuality()) {
      setTimeout(() => {
        if (!patchQuality()) setTimeout(patchQuality, 400);
      }, 150);
    }

    const pageInfo = document.getElementById('page-info');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const book = document.getElementById('flipbook-container');
    const stage = document.getElementById('stage');

    function catalogPageFromIndex(idx) {
      return Math.max(1, Math.min(idx, TOTAL_PAGES));
    }

    function updateUI() {
      const idx = pageFlip.getCurrentPageIndex();
      const displayCurrent = catalogPageFromIndex(idx);
      pageInfo.textContent = displayCurrent + ' / ' + TOTAL_PAGES;
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= TOTAL_PAGES;
    }

    pageFlip.on('flip', updateUI);
    pageFlip.on('changeOrientation', updateUI);
    pageFlip.on('changeState', updateUI);

    prevBtn.addEventListener('click', () => pageFlip.flipPrev());
    nextBtn.addEventListener('click', () => pageFlip.flipNext());

    setTimeout(() => {
      const hint = document.getElementById('hint');
      if (hint) hint.style.opacity = '0';
    }, 5000);

    setTimeout(updateUI, 400);

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function enterFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el);
    }

    function exitFullscreen() {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }

    document.getElementById('toggle-fs').addEventListener('click', enterFullscreen);
    document.getElementById('exit-fs').addEventListener('click', exitFullscreen);

    const view = { scale: 1, tx: 0, ty: 0 };

    function fitScale() {
      const vw = stage.clientWidth;
      const vh = stage.clientHeight;
      const padX = 32;
      const padY = 96;
      return Math.min((vw - padX) / PAGE_W, (vh - padY) / PAGE_H);
    }

    function applyView() {
      book.style.transform =
        'translate(-50%, -50%) translate(' + view.tx + 'px, ' + view.ty + 'px) scale(' + view.scale + ')';
    }

    function setWindowedFit() {
      view.scale = fitScale();
      view.tx = 0;
      view.ty = 0;
      applyView();
    }

    function setFullscreenNative() {
      view.scale = 1;
      view.tx = 0;
      view.ty = 0;
      applyView();
    }

    function onFsChange() {
      const on = isFullscreen();
      document.body.classList.toggle('is-fs', on);
      if (on) setFullscreenNative();
      else setWindowedFit();
    }

    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);

    window.addEventListener('resize', () => {
      if (isFullscreen()) applyView();
      else setWindowedFit();
    });

    setWindowedFit();

    stage.addEventListener('wheel', (e) => {
      if (!isFullscreen()) return;
      e.preventDefault();

      const min = 0.4;
      const max = 1;
      const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
      const next = Math.min(max, Math.max(min, view.scale * factor));
      if (Math.abs(next - view.scale) < 0.001) return;

      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - rect.left - rect.width / 2;
      const cy = e.clientY - rect.top - rect.height / 2;
      const k = next / view.scale;
      view.tx = cx - (cx - view.tx) * k;
      view.ty = cy - (cy - view.ty) * k;
      view.scale = next;
      applyView();
    }, { passive: false });

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    stage.addEventListener('pointerdown', (e) => {
      if (!isFullscreen()) return;
      if (e.target.closest('.controls')) return;
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      view.tx += e.clientX - lastX;
      view.ty += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      applyView();
    });

    function endDrag() { dragging = false; }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (isFullscreen()) exitFullscreen();
        return;
      }
      if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      if (e.key === 'ArrowRight') pageFlip.flipNext();
      if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
        if (isFullscreen()) exitFullscreen();
        else enterFullscreen();
      }
    });
  </script>
</body>
</html>
